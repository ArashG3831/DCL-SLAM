robot1:
  controller_server:
    ros__parameters:
      use_sim_time: true
      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugin: progress_checker
      goal_checker_plugins:
      - general_goal_checker
      controller_plugins:
      - FollowPath
      progress_checker:
        plugin: nav2_controller::SimpleProgressChecker
        required_movement_radius: 0.25
        movement_time_allowance: 20.0
      general_goal_checker:
        plugin: nav2_controller::SimpleGoalChecker
        xy_goal_tolerance: 0.06
        yaw_goal_tolerance: 6.28
        stateful: true
      FollowPath:
        plugin: dwb_core::DWBLocalPlanner
        debug_trajectory_details: false
        min_vel_x: 0.0
        min_vel_y: 0.0
        max_vel_x: 0.13
        max_vel_y: 0.0
        max_vel_theta: 0.35
        min_speed_xy: 0.0
        max_speed_xy: 0.13
        min_speed_theta: 0.0
        acc_lim_x: 0.2
        acc_lim_y: 0.0
        acc_lim_theta: 1.2
        decel_lim_x: -0.2
        decel_lim_y: 0.0
        decel_lim_theta: -1.2
        vx_samples: 6
        vy_samples: 5
        vtheta_samples: 21
        sim_time: 1.7
        linear_granularity: 0.01
        angular_granularity: 0.025
        transform_tolerance: 1.5
        xy_goal_tolerance: 0.06
        trans_stopped_velocity: 0.04
        short_circuit_trajectory_evaluation: true
        stateful: true
        critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
        BaseObstacle.scale: 0.2
        PathAlign.scale: 8.0
        PathAlign.forward_point_distance: 0.0025
        GoalAlign.scale: 0.0
        GoalAlign.forward_point_distance: 0.0025
        PathDist.scale: 24.0
        GoalDist.scale: 24.0
        RotateToGoal.scale: 0.0
        RotateToGoal.slowing_factor: 5.0
        RotateToGoal.lookahead_time: -1.0
  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: true
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: robot1/odom
        robot_base_frame: base_footprint
        rolling_window: true
        width: 4
        height: 4
        resolution: 0.01
        robot_radius: 0.055
        plugins:
        - inflation_layer
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          inflation_radius: 0.11
          cost_scaling_factor: 3.5
  velocity_smoother:
    ros__parameters:
      use_sim_time: true
      smoothing_frequency: 20.0
      scale_velocities: false
      feedback: OPEN_LOOP
      max_velocity:
      - 0.13
      - 0.0
      - 0.35
      min_velocity:
      - 0.0
      - 0.0
      - -0.35
      max_accel:
      - 0.2
      - 0.0
      - 1.2
      max_decel:
      - -0.2
      - 0.0
      - -1.2
      odom_topic: /robot1/odom
      odom_duration: 0.1
      velocity_timeout: 1.0
  collision_monitor:
    ros__parameters:
      use_sim_time: true
      base_frame_id: robot1/base_footprint
      odom_frame_id: robot1/odom
      cmd_vel_in_topic: cmd_vel_smoothed
      cmd_vel_out_topic: cmd_vel_unstamped
      state_topic: collision_monitor_state
      transform_tolerance: 0.2
      source_timeout: 2.0
      stop_pub_timeout: 2.0
      observation_sources:
      - scan
      scan:
        type: scan
        topic: /robot1/scan_d500_fixed
        enabled: true
      polygons:
      - StopCircle
      StopCircle:
        type: circle
        radius: 0.08
        action_type: stop
        min_points: 4
        visualize: false
  lifecycle_manager_navigation:
    ros__parameters:
      use_sim_time: true
      autostart: true
      node_names:
      - controller_server
      - velocity_smoother
      - collision_monitor

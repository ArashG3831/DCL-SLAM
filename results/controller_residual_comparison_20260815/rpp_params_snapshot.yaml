robot1:
  controller_server:
    ros__parameters:
      use_sim_time: true
      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugin: progress_checker
      goal_checker_plugins:
      - general_goal_checker
      controller_plugins:
      - FollowPath
      progress_checker:
        plugin: nav2_controller::SimpleProgressChecker
        required_movement_radius: 0.25
        movement_time_allowance: 20.0
      general_goal_checker:
        plugin: nav2_controller::SimpleGoalChecker
        xy_goal_tolerance: 0.06
        yaw_goal_tolerance: 6.28
        stateful: true
      FollowPath:
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        desired_linear_vel: 0.13
        lookahead_dist: 0.2
        min_lookahead_dist: 0.12
        max_lookahead_dist: 0.3
        lookahead_time: 1.5
        use_velocity_scaled_lookahead_dist: true
        use_regulated_linear_velocity_scaling: true
        regulated_linear_scaling_min_radius: 0.5
        regulated_linear_scaling_min_speed: 0.026
        use_rotate_to_heading: true
        rotate_to_heading_min_angle: 0.785
        rotate_to_heading_angular_vel: 0.35
        max_angular_accel: 0.2
        allow_reversing: false
        use_collision_detection: true
        stateful: true
  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: true
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: robot1/odom
        robot_base_frame: base_footprint
        rolling_window: true
        width: 4
        height: 4
        resolution: 0.01
        robot_radius: 0.055
        plugins:
        - inflation_layer
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          inflation_radius: 0.11
          cost_scaling_factor: 3.5
  velocity_smoother:
    ros__parameters:
      use_sim_time: true
      smoothing_frequency: 20.0
      scale_velocities: false
      feedback: OPEN_LOOP
      max_velocity:
      - 0.13
      - 0.0
      - 0.35
      min_velocity:
      - 0.0
      - 0.0
      - -0.35
      max_accel:
      - 0.2
      - 0.0
      - 1.2
      max_decel:
      - -0.2
      - 0.0
      - -1.2
      odom_topic: /robot1/odom
      odom_duration: 0.1
      velocity_timeout: 1.0
  collision_monitor:
    ros__parameters:
      use_sim_time: true
      base_frame_id: robot1/base_footprint
      odom_frame_id: robot1/odom
      cmd_vel_in_topic: cmd_vel_smoothed
      cmd_vel_out_topic: cmd_vel_unstamped
      state_topic: collision_monitor_state
      transform_tolerance: 0.2
      source_timeout: 2.0
      stop_pub_timeout: 2.0
      observation_sources:
      - scan
      scan:
        type: scan
        topic: /robot1/scan_d500_fixed
        enabled: true
      polygons:
      - StopCircle
      StopCircle:
        type: circle
        radius: 0.08
        action_type: stop
        min_points: 4
        visualize: false
  lifecycle_manager_navigation:
    ros__parameters:
      use_sim_time: true
      autostart: true
      node_names:
      - controller_server
      - velocity_smoother
      - collision_monitor

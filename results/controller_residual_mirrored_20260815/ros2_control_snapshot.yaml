/robot1/controller_manager:
  ros__parameters:
    update_rate: 50
    diffdrive_controller:
      type: diff_drive_controller/DiffDriveController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
/robot1/diffdrive_controller:
  ros__parameters:
    left_wheel_names:
    - left wheel motor
    right_wheel_names:
    - right wheel motor
    wheel_separation: 0.052
    wheel_radius: 0.02
    wheel_separation_multiplier: 1.095
    use_stamped_vel: true
    base_frame_id: base_footprint
    enable_odom_tf: true
    odom_frame_id: odom
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.13
        min_velocity: -0.13
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 0.35
        min_velocity: -0.35
/robot1/joint_state_broadcaster:
  ros__parameters: {}
